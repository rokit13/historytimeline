name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which target to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - marketing
          - app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DO_DEPLOY_PATH }}"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull origin "${{ github.ref_name }}"

            if [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "api" ]; then
              API_SERVICE_NAME="${{ secrets.DO_API_SERVICE }}" ./scripts/deploy-api.sh
            fi

            if [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "marketing" ]; then
              NEXT_SERVICE_NAME="${{ secrets.DO_MARKETING_SERVICE }}" ./scripts/deploy-next.sh marketing
            fi

            if [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "app" ]; then
              NEXT_SERVICE_NAME="${{ secrets.DO_APP_SERVICE }}" ./scripts/deploy-next.sh app
            fi
